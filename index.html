<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text2Img - 文字轉圖片</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Huninn&family=Iansui&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500&family=Dela+Gothic+One&family=Kosugi+Maru&family=Yusei+Magic&family=DotGothic16&family=Klee+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #262626;
      --text: #fafafa;
      --text-muted: #737373;
      --accent: #3b82f6;
      --radius: 8px;
    }

    :root.light {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --border: #e5e5e5;
      --text: #171717;
      --text-muted: #737373;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Editor Section */
    .editor-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 32px;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .toolbar-btn {
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .toolbar-btn:hover {
      background: var(--border);
    }

    .toolbar-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .toolbar input[type="color"] {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .toolbar input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .toolbar input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 2px;
    }

    .toolbar select {
      padding: 6px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .toolbar input[type="range"] {
      width: 100px;
      height: 4px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
    }

    .toolbar input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .toolbar-value {
      font-size: 12px;
      font-family: monospace;
      color: var(--text);
      min-width: 40px;
    }

    /* Rich Editor */
    .editor-area {
      min-height: 150px;
      padding: 20px;
      font-size: 32px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      outline: none;
    }

    .editor-area:empty:before {
      content: '輸入文字，選取後可改大小、顏色、底色';
      color: #999;
    }

    /* Settings Row */
    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 32px;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .setting-group label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .setting-group select {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
    }

    /* Preview Cards */
    .cards-grid {
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
    }

    .card-font-name {
      font-size: 12px;
      color: var(--text-muted);
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Favorite Button */
    .favorite-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-muted);
      transition: color 0.15s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .favorite-btn:hover {
      color: #fbbf24;
      transform: scale(1.1);
    }

    .favorite-btn.active {
      color: #fbbf24;
    }

    .favorite-btn svg {
      width: 18px;
      height: 18px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Section Divider */
    .section-divider {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
    }

    .section-divider.favorites {
      color: #fbbf24;
      border-color: #fbbf2440;
      background: #fbbf2410;
    }

    .card-preview {
      padding: 32px;
      min-height: 80px;
      /* 棋盤格 = 透明 */
      background: #f5f5f5;
      background-image:
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
        linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
        linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .card-preview.white-bg {
      background: #fff;
      background-image: none;
    }

    .card-preview canvas {
      display: block;
      max-width: 100%;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Nav */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav a {
      padding: 8px 16px;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .nav a:hover {
      color: var(--text);
      background: var(--border);
    }

    .nav a.active {
      color: var(--text);
      background: var(--accent);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      background: var(--border);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .theme-toggle .icon-sun {
      display: none;
    }

    :root.light .theme-toggle .icon-sun {
      display: block;
    }

    :root.light .theme-toggle .icon-moon {
      display: none;
    }

    @media (max-width: 600px) {
      .toolbar {
        gap: 6px;
        padding: 10px 12px;
      }
      .settings-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-links">
      <a href="index.html" class="active">Text2Img</a>
      <a href="img.html">Img+Text</a>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切換主題">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </nav>
  <div class="container">
    <header class="header">
      <h1>Text2Img</h1>
      <p>選取文字 → 改大小/顏色/底色 → 一鍵複製圖片</p>
    </header>

    <!-- Editor -->
    <div class="editor-section">
      <div class="toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">大小</span>
          <input type="range" id="selSize" min="12" max="120" value="48">
          <span class="toolbar-value" id="selSizeValue">48px</span>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button class="toolbar-btn" id="toggleBold" onmousedown="event.preventDefault()"><b>B</b></button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <span class="toolbar-label">文字色</span>
          <input type="color" id="foreColor" value="#000000">
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <span class="toolbar-label">底色</span>
          <input type="color" id="hiliteColor" value="#ffff00">
          <button class="toolbar-btn" id="removeHilite" onmousedown="event.preventDefault()">清除</button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button class="toolbar-btn" id="clearAll" onmousedown="event.preventDefault()">清除全部格式</button>
        </div>
      </div>

      <div id="editor" class="editor-area" contenteditable="true"></div>
    </div>

    <!-- Global Settings -->
    <div class="settings-row">
      <div class="setting-group">
        <label>基本大小</label>
        <select id="baseSize">
          <option value="24">24px</option>
          <option value="32">32px</option>
          <option value="40">40px</option>
          <option value="48" selected>48px</option>
          <option value="56">56px</option>
          <option value="64">64px</option>
          <option value="72">72px</option>
        </select>
      </div>

      <div class="setting-group">
        <label>預設文字色</label>
        <input type="color" id="defaultColor" value="#000000" style="width:32px;height:32px;border:1px solid var(--border);border-radius:4px;background:transparent;">
      </div>

      <div class="setting-group">
        <label>圖片背景</label>
        <select id="bgType">
          <option value="transparent">透明</option>
          <option value="white">白色</option>
        </select>
      </div>
    </div>

    <!-- Cards -->
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <div class="toast" id="toast">已複製到剪貼簿</div>

  <script>
    const fonts = [
      { name: 'Huninn', displayName: 'jf open 粉圓' },
      { name: 'Iansui', displayName: '芫荽' },
      { name: 'LXGW WenKai TC', displayName: '霞鶩文楷 TC' },
      { name: 'Noto Sans TC', displayName: '思源黑體' },
      { name: 'Noto Serif TC', displayName: '思源宋體' },
      { name: 'Zen Maru Gothic', displayName: '禪丸黑體（圓）' },
      { name: 'Kosugi Maru', displayName: '小杉圓體' },
      { name: 'Klee One', displayName: 'Klee One' },
      { name: 'Dela Gothic One', displayName: '超粗黑體' },
      { name: 'Yusei Magic', displayName: '油性魔術' },
      { name: 'DotGothic16', displayName: '點陣黑體 16' },
    ];

    const editor = document.getElementById('editor');
    const cardsGrid = document.getElementById('cardsGrid');
    const baseSize = document.getElementById('baseSize');
    const defaultColor = document.getElementById('defaultColor');
    const bgType = document.getElementById('bgType');
    const foreColor = document.getElementById('foreColor');
    const hiliteColor = document.getElementById('hiliteColor');
    const selSize = document.getElementById('selSize');
    const selSizeValue = document.getElementById('selSizeValue');
    const toast = document.getElementById('toast');

    // 收藏字體功能
    function getFavoriteFonts() {
      try {
        return JSON.parse(localStorage.getItem('favoriteFonts')) || [];
      } catch {
        return [];
      }
    }

    function saveFavoriteFonts(favorites) {
      localStorage.setItem('favoriteFonts', JSON.stringify(favorites));
    }

    function toggleFavorite(fontName) {
      const favorites = getFavoriteFonts();
      const index = favorites.indexOf(fontName);
      if (index === -1) {
        favorites.push(fontName);
      } else {
        favorites.splice(index, 1);
      }
      saveFavoriteFonts(favorites);
      initCards();
      renderAll();
    }

    function isFavorite(fontName) {
      return getFavoriteFonts().includes(fontName);
    }

    // 保存選取範圍
    let savedRange = null;

    editor.addEventListener('mouseup', saveSelection);
    editor.addEventListener('keyup', saveSelection);
    editor.addEventListener('select', saveSelection);

    // 工具列互動前保存選取
    document.querySelector('.toolbar').addEventListener('mousedown', () => {
      saveSelection();
    });

    function saveSelection() {
      const sel = window.getSelection();
      if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
        savedRange = sel.getRangeAt(0).cloneRange();
      }
    }

    function restoreSelection() {
      if (savedRange) {
        editor.focus();
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    // Slider 顯示即時更新
    selSize.addEventListener('input', () => {
      selSizeValue.textContent = selSize.value + 'px';
    });

    // 放開滑桿時套用大小
    selSize.addEventListener('change', () => {
      restoreSelection();
      const size = selSize.value + 'px';
      applyStyleToSelection('fontSize', size);
      renderAll();
    });

    // Bold toggle
    document.getElementById('toggleBold').addEventListener('click', () => {
      restoreSelection();
      document.execCommand('bold');
      renderAll();
    });

    // 即時套用文字色
    foreColor.addEventListener('input', () => {
      restoreSelection();
      document.execCommand('foreColor', false, foreColor.value);
      renderAll();
    });

    // 即時套用底色
    hiliteColor.addEventListener('input', () => {
      restoreSelection();
      document.execCommand('hiliteColor', false, hiliteColor.value);
      renderAll();
    });

    document.getElementById('removeHilite').addEventListener('click', () => {
      restoreSelection();
      document.execCommand('hiliteColor', false, 'transparent');
      renderAll();
    });

    // Clear all
    document.getElementById('clearAll').addEventListener('click', () => {
      restoreSelection();
      document.execCommand('removeFormat');
      renderAll();
    });

    // Apply custom style to selection (for font-size with exact px)
    function applyStyleToSelection(prop, value) {
      const sel = window.getSelection();
      if (!sel.rangeCount || sel.isCollapsed) return;

      // 先用 execCommand 插入一個可識別的 font size
      document.execCommand('fontSize', false, '7');

      // 找到剛插入的 font[size="7"] 元素並修改
      const fontElements = editor.querySelectorAll('font[size="7"]');
      fontElements.forEach(el => {
        el.removeAttribute('size');
        el.style.fontSize = value;
      });

      // 如果沒有找到 font 元素，嘗試用 span 包裝
      if (fontElements.length === 0) {
        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.style[prop] = value;
        try {
          range.surroundContents(span);
        } catch (e) {
          // 選取跨越多個元素時，提取內容再包裝
          const contents = range.extractContents();
          span.appendChild(contents);
          range.insertNode(span);
        }
      }
    }

    // Settings changes
    baseSize.addEventListener('change', renderAll);
    defaultColor.addEventListener('input', renderAll);
    bgType.addEventListener('change', () => {
      document.querySelectorAll('.card-preview').forEach(el => {
        el.classList.toggle('white-bg', bgType.value === 'white');
      });
      renderAll();
    });

    // Editor input
    editor.addEventListener('input', renderAll);

    // 星星 SVG
    const starOutlineSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    const starFilledSvg = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

    // Generate cards
    function initCards() {
      const favorites = getFavoriteFonts();
      const favoriteFonts = fonts.filter(f => favorites.includes(f.name));
      const otherFonts = fonts.filter(f => !favorites.includes(f.name));

      let html = '';

      // 如果有收藏字體，顯示「我的最愛」區塊
      if (favoriteFonts.length > 0) {
        html += '<div class="section-divider favorites">我的最愛</div>';
        html += favoriteFonts.map((font) => createCardHtml(font, fonts.indexOf(font))).join('');
        html += '<div class="section-divider">全部字體</div>';
      }

      // 顯示其他字體
      html += otherFonts.map((font) => createCardHtml(font, fonts.indexOf(font))).join('');

      cardsGrid.innerHTML = html;

      // Copy handlers
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => copyCanvas(parseInt(btn.dataset.index)));
      });

      // Favorite handlers
      document.querySelectorAll('.favorite-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(btn.dataset.font);
        });
      });
    }

    function createCardHtml(font, index) {
      const isFav = isFavorite(font.name);
      return `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title-row">
                <div class="card-title">${font.displayName}</div>
                <button class="favorite-btn ${isFav ? 'active' : ''}" data-font="${font.name}" title="${isFav ? '取消收藏' : '加入收藏'}">
                  ${isFav ? starFilledSvg : starOutlineSvg}
                </button>
              </div>
              <div class="card-font-name">${font.name}</div>
            </div>
            <button class="copy-btn" data-index="${index}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              複製
            </button>
          </div>
          <div class="card-preview ${bgType.value === 'white' ? 'white-bg' : ''}">
            <canvas id="canvas-${index}"></canvas>
          </div>
        </div>
      `;
    }

    // Parse editor content into styled segments
    function parseEditorContent() {
      const segments = [];
      const defaultSize = parseInt(baseSize.value);
      const defaultClr = defaultColor.value;

      // Size mapping (execCommand fontSize uses 1-7)
      const sizeMap = {
        1: 0.5, 2: 0.7, 3: 0.9, 4: 1.0, 5: 1.2, 6: 1.5, 7: 2.0
      };

      function traverse(node, inherited) {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent;
          if (text) {
            segments.push({
              text,
              size: inherited.size,
              color: inherited.color,
              bg: inherited.bg,
              bold: inherited.bold
            });
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          let size = inherited.size;
          let color = inherited.color;
          let bg = inherited.bg;
          let bold = inherited.bold;

          // Check for bold
          if (node.tagName === 'B' || node.tagName === 'STRONG') {
            bold = true;
          }

          // Check for font size
          if (node.tagName === 'FONT' && node.size) {
            const s = parseInt(node.size);
            size = defaultSize * (sizeMap[s] || 1);
          }

          // Check inline styles
          const style = node.style;
          if (style.fontSize) {
            const fs = style.fontSize;
            if (fs.includes('px')) {
              size = parseFloat(fs);
            } else {
              const namedSizes = {
                'xx-small': 0.5, 'x-small': 0.6, 'small': 0.8, 'medium': 1.0,
                'large': 1.2, 'x-large': 1.5, 'xx-large': 2.0, '-webkit-xxx-large': 2.5
              };
              if (namedSizes[fs]) size = defaultSize * namedSizes[fs];
            }
          }
          if (style.color) {
            color = style.color;
          }
          if (style.backgroundColor && style.backgroundColor !== 'transparent') {
            bg = style.backgroundColor;
          }
          if (style.fontWeight === 'bold' || parseInt(style.fontWeight) >= 700) {
            bold = true;
          }

          // Check font color attribute
          if (node.tagName === 'FONT' && node.color) {
            color = node.color;
          }

          // Handle line breaks
          if (node.tagName === 'BR') {
            segments.push({ text: '\n', size, color, bg, bold });
          }

          // 判斷是否為塊級元素
          const isBlock = node.tagName === 'DIV' || node.tagName === 'P';

          // Traverse children
          for (const child of node.childNodes) {
            traverse(child, { size, color, bg, bold });
          }

          // 塊級元素結束後加換行（除非已經是換行）
          if (isBlock && segments.length > 0 && segments[segments.length - 1].text !== '\n') {
            segments.push({ text: '\n', size, color, bg, bold });
          }
        }
      }

      traverse(editor, { size: defaultSize, color: defaultClr, bg: null, bold: false });

      // 移除結尾多餘的換行
      while (segments.length > 0 && segments[segments.length - 1].text === '\n') {
        segments.pop();
      }

      return segments;
    }

    // Render text to canvas
    async function renderCanvas(fontName, canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const segments = parseEditorContent();

      if (segments.length === 0 || segments.every(s => !s.text.trim())) {
        canvas.width = 200;
        canvas.height = 60;
        ctx.clearRect(0, 0, 200, 60);
        ctx.fillStyle = '#999';
        ctx.font = '16px "DM Sans"';
        ctx.textAlign = 'center';
        ctx.fillText('請輸入文字', 100, 35);
        return;
      }

      // Wait for font
      await document.fonts.ready;
      const testSize = parseInt(baseSize.value);
      await document.fonts.load(`${testSize}px "${fontName}"`);
      await document.fonts.load(`bold ${testSize}px "${fontName}"`);

      // Split into lines
      const padding = 20;
      let lines = [[]];

      segments.forEach(seg => {
        if (seg.text.includes('\n')) {
          const parts = seg.text.split('\n');
          parts.forEach((part, i) => {
            if (part) {
              lines[lines.length - 1].push({ ...seg, text: part });
            }
            if (i < parts.length - 1) {
              lines.push([]);
            }
          });
        } else {
          lines[lines.length - 1].push(seg);
        }
      });

      // Calculate dimensions
      let maxWidth = 0;
      const lineHeights = [];

      lines.forEach(line => {
        let lineWidth = 0;
        let maxLineHeight = parseInt(baseSize.value) * 1.4;

        // 空行也要有高度
        if (line.length === 0) {
          lineHeights.push(maxLineHeight);
          return;
        }

        line.forEach(seg => {
          const weight = seg.bold ? 'bold ' : '';
          ctx.font = `${weight}${seg.size}px "${fontName}", sans-serif`;
          lineWidth += ctx.measureText(seg.text).width;
          maxLineHeight = Math.max(maxLineHeight, seg.size * 1.4);
        });

        maxWidth = Math.max(maxWidth, lineWidth);
        lineHeights.push(maxLineHeight);
      });

      const totalHeight = lineHeights.reduce((a, b) => a + b, 0);

      canvas.width = maxWidth + padding * 2;
      canvas.height = totalHeight + padding * 2;

      // Clear (transparent)
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw
      let y = padding;
      lines.forEach((line, lineIdx) => {
        let x = padding;
        const lineHeight = lineHeights[lineIdx];

        line.forEach(seg => {
          const weight = seg.bold ? 'bold ' : '';
          ctx.font = `${weight}${seg.size}px "${fontName}", sans-serif`;

          // Background highlight
          if (seg.bg) {
            const w = ctx.measureText(seg.text).width;
            ctx.fillStyle = seg.bg;
            ctx.fillRect(x, y, w, lineHeight);
          }

          // Text
          ctx.fillStyle = seg.color;
          ctx.textBaseline = 'middle';
          ctx.fillText(seg.text, x, y + lineHeight / 2);

          x += ctx.measureText(seg.text).width;
        });

        y += lineHeight;
      });
    }

    // Render all canvases
    async function renderAll() {
      for (let i = 0; i < fonts.length; i++) {
        await renderCanvas(fonts[i].name, `canvas-${i}`);
      }
    }

    // Copy canvas to clipboard
    async function copyCanvas(index) {
      const canvas = document.getElementById(`canvas-${index}`);
      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast();
      } catch (err) {
        console.error('Copy failed:', err);
        alert('複製失敗');
      }
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light');
      }
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    themeToggle.addEventListener('click', toggleTheme);

    // Init
    initTheme();
    initCards();
    renderAll();
  </script>
</body>
</html>
