<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Img+Text - 圖片加字</title>
  
  <!-- Google Fonts - 確定能用的中文字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Huninn&family=Iansui&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&family=Klee+One&family=Zen+Maru+Gothic:wght@400;500&family=Dela+Gothic+One&family=Kosugi+Maru&family=Yusei+Magic&family=DotGothic16&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #262626;
      --text: #fafafa;
      --text-muted: #737373;
      --accent: #3b82f6;
      --accent-dim: rgba(59, 130, 246, 0.1);
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 32px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Upload Area */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 60px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 28px;
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .upload-area.has-image {
      padding: 16px;
      border-style: solid;
    }

    .upload-area svg {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .upload-area p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .upload-area input {
      display: none;
    }

    .uploaded-img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 4px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-group label {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .control-group input[type="text"] {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      min-width: 200px;
      flex: 1;
    }

    .control-group input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .control-group select {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    .control-group input[type="range"] {
      width: 100px;
      height: 4px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .control-group input[type="color"] {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    .control-group input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .control-group input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border);
      border-radius: 4px;
    }

    .value {
      font-size: 12px;
      color: var(--text);
      min-width: 35px;
      font-family: monospace;
    }

    .section-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-right: 8px;
      border-right: 2px solid var(--accent);
      margin-right: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Preview */
    .preview-section {
      margin-bottom: 32px;
    }

    .preview-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .preview-container {
      display: inline-block;
      background: #f5f5f5;
      background-image: 
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
        linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
        linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border-radius: var(--radius);
      padding: 24px;
    }

    #previewCanvas {
      display: block;
      max-width: 100%;
      border-radius: 4px;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-primary:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 16px;
      }
      
      .control-row {
        flex-direction: column;
        align-items: stretch;
      }
      
      .control-group {
        width: 100%;
      }
      
      .control-group input[type="text"] {
        width: 100%;
      }
      
      .control-row .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Img + Text</h1>
      <p>貼圖 → 底下加字 → 一鍵複製</p>
    </header>

    <div class="upload-area" id="uploadArea">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <p>點擊上傳、拖放、或直接 Ctrl+V 貼上</p>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="controls">
      <!-- 文字設定 -->
      <div class="control-row">
        <div class="control-group" style="flex: 1;">
          <label>文字</label>
          <input type="text" id="textInput" placeholder="輸入底部文字..." style="flex: 1;">
        </div>
        <button class="btn btn-primary" id="copyBtn" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          複製圖片
        </button>
      </div>

      <!-- 文字樣式 -->
      <div class="control-row">
        <span class="section-label">文字</span>
        
        <div class="control-group">
          <label>字型</label>
          <select id="fontSelect">
            <optgroup label="台灣專用">
              <option value="Huninn">jf open 粉圓</option>
              <option value="Iansui">芫荽</option>
            </optgroup>
            <optgroup label="楷書">
              <option value="LXGW WenKai TC">霞鶩文楷 TC</option>
              <option value="Klee One">Klee One</option>
            </optgroup>
            <optgroup label="黑體">
              <option value="Noto Sans TC">思源黑體</option>
              <option value="Zen Maru Gothic">禪丸黑體（圓）</option>
              <option value="Kosugi Maru">小杉圓體</option>
            </optgroup>
            <optgroup label="宋/明體">
              <option value="Noto Serif TC">思源宋體</option>
            </optgroup>
            <optgroup label="特殊風格">
              <option value="Dela Gothic One">超粗黑體</option>
              <option value="Yusei Magic">油性魔術</option>
              <option value="DotGothic16">點陣黑體 16</option>
            </optgroup>
          </select>
        </div>
        
        <div class="control-group">
          <label>大小</label>
          <input type="range" id="fontSize" min="12" max="72" value="24">
          <span class="value" id="fontSizeValue">24px</span>
        </div>
        
        <div class="control-group">
          <label>顏色</label>
          <input type="color" id="textColor" value="#000000">
        </div>
        
        <div class="control-group">
          <label>底色</label>
          <input type="color" id="textBgColor" value="#ffffff">
          <label class="checkbox-label">
            <input type="checkbox" id="textBgTransparent">
            透明
          </label>
        </div>
      </div>

      <!-- 圖片設定 -->
      <div class="control-row">
        <span class="section-label">圖片</span>
        
        <div class="control-group">
          <label>底色</label>
          <input type="color" id="imgBgColor" value="#ffffff">
          <label class="checkbox-label">
            <input type="checkbox" id="imgBgTransparent" checked>
            透明
          </label>
        </div>
        
        <div class="control-group">
          <label>邊距</label>
          <input type="range" id="imgPadding" min="0" max="48" value="16">
          <span class="value" id="imgPaddingValue">16px</span>
        </div>
      </div>
    </div>

    <div class="preview-section">
      <div class="preview-label">預覽</div>
      <div class="preview-container">
        <canvas id="previewCanvas" width="300" height="200"></canvas>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="clearBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        清除重來
      </button>
    </div>
  </div>

  <div class="toast" id="toast">已複製到剪貼簿</div>

  <script>
    // Elements
    const uploadArea = document.getElementById('uploadArea');
    const imageInput = document.getElementById('imageInput');
    const textInput = document.getElementById('textInput');
    const fontSelect = document.getElementById('fontSelect');
    const fontSize = document.getElementById('fontSize');
    const fontSizeValue = document.getElementById('fontSizeValue');
    const textColor = document.getElementById('textColor');
    const textBgColor = document.getElementById('textBgColor');
    const textBgTransparent = document.getElementById('textBgTransparent');
    const imgBgColor = document.getElementById('imgBgColor');
    const imgBgTransparent = document.getElementById('imgBgTransparent');
    const imgPadding = document.getElementById('imgPadding');
    const imgPaddingValue = document.getElementById('imgPaddingValue');
    const previewCanvas = document.getElementById('previewCanvas');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');
    
    const ctx = previewCanvas.getContext('2d');
    let uploadedImage = null;

    // Upload handlers
    uploadArea.addEventListener('click', () => imageInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--accent)';
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '';
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        loadImage(file);
      }
    });
    
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadImage(file);
    });

    // 貼上圖片 (Ctrl+V / Cmd+V)
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            loadImage(file);
            break;
          }
        }
      }
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          uploadedImage = img;
          uploadArea.classList.add('has-image');
          uploadArea.innerHTML = `<img src="${e.target.result}" class="uploaded-img">`;
          copyBtn.disabled = false;
          renderPreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Render preview
    async function renderPreview() {
      const text = textInput.value;
      const font = fontSelect.value;
      const size = parseInt(fontSize.value);
      const txtColor = textColor.value;
      const txtBg = textBgTransparent.checked ? null : textBgColor.value;
      const imgBg = imgBgTransparent.checked ? null : imgBgColor.value;
      const pad = parseInt(imgPadding.value);
      
      // Wait for font
      await document.fonts.ready;
      await document.fonts.load(`${size}px "${font}"`);
      
      if (!uploadedImage) {
        // Empty state
        previewCanvas.width = 300;
        previewCanvas.height = 200;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 300, 200);
        ctx.fillStyle = '#999';
        ctx.font = '14px "DM Sans"';
        ctx.textAlign = 'center';
        ctx.fillText('請先上傳圖片', 150, 100);
        return;
      }
      
      const imgW = uploadedImage.width;
      const imgH = uploadedImage.height;
      
      // Calculate text height
      const textHeight = text ? size * 1.4 + 16 : 0;
      
      // Set canvas size
      const canvasW = imgW + pad * 2;
      const canvasH = imgH + pad * 2 + textHeight;
      
      previewCanvas.width = canvasW;
      previewCanvas.height = canvasH;
      
      // Clear (transparent)
      ctx.clearRect(0, 0, canvasW, canvasH);
      
      // Image background (optional)
      if (imgBg) {
        ctx.fillStyle = imgBg;
        ctx.fillRect(0, 0, canvasW, imgH + pad * 2);
      }
      
      // Image
      ctx.drawImage(uploadedImage, pad, pad, imgW, imgH);
      
      // Text area
      if (text) {
        const textY = imgH + pad * 2;
        
        // Text background (optional)
        if (txtBg) {
          ctx.fillStyle = txtBg;
          ctx.fillRect(0, textY, canvasW, textHeight);
        }
        
        // Text
        ctx.font = `${size}px "${font}"`;
        ctx.fillStyle = txtColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvasW / 2, textY + textHeight / 2);
      }
    }

    // Event listeners
    textInput.addEventListener('input', renderPreview);
    fontSelect.addEventListener('change', renderPreview);
    fontSize.addEventListener('input', () => {
      fontSizeValue.textContent = fontSize.value + 'px';
      renderPreview();
    });
    textColor.addEventListener('input', renderPreview);
    textBgColor.addEventListener('input', renderPreview);
    textBgTransparent.addEventListener('change', renderPreview);
    imgBgColor.addEventListener('input', renderPreview);
    imgBgTransparent.addEventListener('change', renderPreview);
    imgPadding.addEventListener('input', () => {
      imgPaddingValue.textContent = imgPadding.value + 'px';
      renderPreview();
    });

    // Copy
    copyBtn.addEventListener('click', async () => {
      if (!uploadedImage) return;
      
      try {
        const blob = await new Promise(resolve => previewCanvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        showToast();
      } catch (err) {
        console.error('Copy failed:', err);
        alert('複製失敗');
      }
    });

    // Clear
    clearBtn.addEventListener('click', () => {
      uploadedImage = null;
      uploadArea.classList.remove('has-image');
      uploadArea.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>點擊上傳、拖放、或直接 Ctrl+V 貼上</p>
        <input type="file" id="imageInput" accept="image/*">
      `;
      document.getElementById('imageInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) loadImage(file);
      });
      copyBtn.disabled = true;
      textInput.value = '';
      renderPreview();
    });

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Init
    renderPreview();
  </script>
</body>
</html>
